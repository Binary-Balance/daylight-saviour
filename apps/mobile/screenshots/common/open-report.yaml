# Starts from a fresh install and opens the Civil Time Report for Sydney.
appId: au.com.binarybalance.daylightsaviour
---
- launchApp:
    clearState: true
# A development build loads its bundle from Metro. The first bundle has taken
# up to 11 minutes on a hosted macOS runner.
- extendedWaitUntil:
    visible: 'Choose another region|Choose Home Time Zone'
    timeout: 900000
# The device's own time zone decides which of the two screens appears.
- runFlow:
    when:
      visible: 'Choose another region'
    commands:
      - tapOn: 'Choose another region'
# At the largest iOS text size the heading fills about two screens.
- scrollUntilVisible:
    element: 'Search Australian Home Time Zones'
    timeout: 60000
- tapOn: 'Search Australian Home Time Zones'
- inputText: 'Sydney'
# The field and first match must stay above the keyboard. Every flow runs
# this one, so each run overwrites the same screenshot.
- takeScreenshot: ${PREFIX}-zone-search
- scrollUntilVisible:
    element: 'Sydney, Canberra & most of NSW, Australia/Sydney'
- tapOn: 'Sydney, Canberra & most of NSW, Australia/Sydney'
# Settings is the report's first item; at the largest iOS text size the
# status is a screen or two below it.
- extendedWaitUntil:
    visible: 'Settings'
    timeout: 30000
