appId: au.com.binarybalance.daylightsaviour
---
# At the largest text size the event fills more than one screen, so this
# stops at its direction and amount, then at its countdown. The largest iOS
# report is about 17 screens long, so scrolls get two minutes.
- runFlow: common/open-report.yaml
- scrollUntilVisible:
    element: 'NEXT CHANGE EVENT|RECENT CHANGE EVENT'
    centerElement: true
    timeout: 120000
- waitForAnimationToEnd
- takeScreenshot: ${PREFIX}-change-event
- scrollUntilVisible:
    element: 'COUNTDOWN|CHANGE COMPLETED'
    centerElement: true
    timeout: 120000
- waitForAnimationToEnd
- takeScreenshot: ${PREFIX}-change-event-countdown
