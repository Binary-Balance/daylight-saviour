name: Code assurance

on:
  pull_request:
    paths-ignore:
      - '**/*.md'
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
  schedule:
    - cron: '0 16 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seshat:
    name: Seshat (${{ matrix.area }})
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        # Set blocking to true once an area meets every threshold (#148).
        include:
          - area: packages
            blocking: true # #152
          - area: notifications
            blocking: false # #153
          - area: mobile
            blocking: false # #154
    env:
      AREA: ${{ matrix.area }}
      BLOCKING: ${{ matrix.blocking }}
      # Mutation testing notifications and mobile takes too long for every
      # change, so they get CRAP analysis here and full checks weekly.
      COMMAND: ${{ (matrix.area == 'packages' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'check' || 'crap' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build copy package
        run: npm run build --workspace @daylight-saviour/copy

      - name: Run Seshat
        run: |
          set +e
          node_modules/.bin/seshat "$COMMAND" --config "seshat.$AREA.json" --json > "seshat-$AREA.json"
          status=$?
          set -e
          node scripts/seshat-summary.mjs "seshat-$AREA.json" | tee -a "$GITHUB_STEP_SUMMARY"
          # Seshat exits 1 for any missed threshold. Type-safety limits always
          # block. CRAP, complexity and mutation only warn until the area is
          # blocking. Incomplete runs, including an unknown inferred-any count,
          # exit 2 and always fail.
          if [ "$status" = 1 ] && [ "$BLOCKING" != true ]; then
            if jq -e '[.quality.checks[] | select((.metric == "maxInferredAny" or .metric == "maxTypeEscapes") and .state == "failed")] | length > 0' "seshat-$AREA.json" > /dev/null; then
              echo "::error::Seshat type-safety limits exceeded for $AREA"
              exit 1
            fi
            echo "::warning::Seshat thresholds not met for $AREA"
            exit 0
          fi
          exit "$status"

      - name: Keep Seshat report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: seshat-${{ matrix.area }}
          path: seshat-${{ matrix.area }}.json
