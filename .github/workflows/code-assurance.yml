name: Code assurance

on:
  pull_request:
    paths-ignore:
      - '**/*.md'
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
  schedule:
    - cron: '0 16 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seshat:
    name: Seshat (${{ matrix.area }})
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        area: [packages, notifications, mobile]
    env:
      AREA: ${{ matrix.area }}
      # Mutation testing notifications and mobile takes too long for every
      # change, so they get CRAP analysis here and full checks weekly.
      COMMAND: ${{ (matrix.area == 'packages' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'check' || 'crap' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build copy package
        run: npm run build --workspace @daylight-saviour/copy

      - name: Run Seshat
        run: |
          set +e
          node_modules/.bin/seshat "$COMMAND" --config "seshat.$AREA.json" --json > "seshat-$AREA.json"
          status=$?
          set -e
          node scripts/seshat-summary.mjs "seshat-$AREA.json" | tee -a "$GITHUB_STEP_SUMMARY"
          # Thresholds are report-only until each area meets them (#148).
          # Incomplete runs and invalid input still fail.
          if [ "$status" = 1 ]; then
            echo "::warning::Seshat thresholds not met for $AREA"
            exit 0
          fi
          exit "$status"

      - name: Keep Seshat report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seshat-${{ matrix.area }}
          path: seshat-${{ matrix.area }}.json
